<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CloudIDE</title>
        <base id="appBase" href="/" />
        <link rel="preload" id="webassembly" />
        <link
            rel="stylesheet"
            href="lib/bootstrap/dist/css/bootstrap.min.css"
        />
        <link rel="stylesheet" href="css/app.css" />
        <link
            rel="stylesheet"
            data-name="vs/editor/editor.main"
            href="_content/BlazorMonaco/lib/monaco-editor/min/vs/editor/editor.main.css"
        />
        <link rel="icon" type="image/png" href="favicon.png" />
        <link href="CloudIDE.styles.css" rel="stylesheet" />
        <script type="importmap"></script>
    <script>
        // Set base href dynamically based on current path
        const pathArray = window.location.pathname.split('/');
        let basePath = '/';
        if (pathArray[1] === 'browser-cs') {
            basePath = '/browser-cs/';
        }
        document.getElementById('appBase').setAttribute('href', basePath);
    </script>
    </head>

    <body>
        <div id="app">
            <svg class="loading-progress">
                <circle r="40%" cx="50%" cy="50%" />
                <circle r="40%" cx="50%" cy="50%" />
            </svg>
            <div class="loading-progress-text"></div>
        </div>

        <div id="blazor-error-ui">
            An unhandled error has occurred.
            <a href="." class="reload">Reload</a>
            <span class="dismiss">🗙</span>
        </div>
        <script src="_content/BlazorMonaco/jsInterop.js"></script>
        <script src="_content/BlazorMonaco/lib/monaco-editor/min/vs/loader.js"></script>
        <script src="_content/BlazorMonaco/lib/monaco-editor/min/vs/editor/editor.main.nls.js"></script>
        <script src="_content/BlazorMonaco/lib/monaco-editor/min/vs/editor/editor.main.js"></script>
        <script src="_framework/blazor.webassembly.js"></script>
    </body>
</html>
