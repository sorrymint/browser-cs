name: Deploy to GitHub Pages

env:
  PUBLISH_DIR: bin/Release/net9.0/publish/wwwroot

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Publish
      run: dotnet publish -c Release

    # FIX 1: Prevent GitHub from ignoring Blazor's underscore folders (_framework, _content)
    - name: Add .nojekyll
      run: echo dev > ${{ env.PUBLISH_DIR }}/.nojekyll

    # FIX 2: Create a 404.html page copying index.html so deep links/refreshes don't break
    - name: Create 404 page fallback
      run: cp ${{ env.PUBLISH_DIR }}/index.html ${{ env.PUBLISH_DIR }}/404.html

    - name: Rewrite base href
      uses: SteveSandersonMS/ghaction-rewrite-base-href@5b54862a8831e012d4f1a8b2660894415fdde8ec
      with:
        html_path: ${{ env.PUBLISH_DIR }}/index.html
        base_href: /browser-cs/

    # Also rewrite the base href in the 404 page we just created
    - name: Rewrite base href for 404 page
      uses: SteveSandersonMS/ghaction-rewrite-base-href@5b54862a8831e012d4f1a8b2660894415fdde8ec
      with:
        html_path: ${{ env.PUBLISH_DIR }}/404.html
        base_href: /browser-cs/

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ env.PUBLISH_DIR }}

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4